# Приклад: Vorot у підтеці /vorot/ за nginx, поруч з іншою програмою на тому ж порту.
# Vorot запускається з: URL_PREFIX=/vorot LISTEN_HOST=127.0.0.1 LISTEN_PORT=8080 TRUST_PROXY=1
# Файл: /etc/nginx/sites-available/vorot  (+ symlink у sites-enabled)

server {
    listen 5000;
    server_name _;
    absolute_redirect off;                               # переадресації без порту - працює і за прокиданням порту на роутері

    # Нова програма - у підтеці /vorot/
    location = /vorot { return 301 /vorot/; }
    location /vorot/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;   # перезаписує, а не дописує - не підробиш
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;                             # відео й довге опитування без затримок
        proxy_read_timeout 1h;
        client_max_body_size 20m;                        # відновлення з бекапу
    }

    # Стара програма - як і раніше, з кореня
    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
